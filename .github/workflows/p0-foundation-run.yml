name: p0-foundation-run

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/p0-foundation-run.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-foundation-develop
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed P0 patch
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p0-foundation.log
          if [ ! -f src/harness/tui_config.py ]; then
            test -f scripts/p0_patch_parts/part_00.pyfrag
            test -f scripts/p0_patch_parts/part_05.pyfrag
            cat scripts/p0_patch_parts/part_*.pyfrag > scripts/.apply_p0_foundation_runtime.py
            python scripts/.apply_p0_foundation_runtime.py 2>&1 | tee -a /tmp/p0-foundation.log
          else
            echo 'P0 source already present; validating committed implementation.' | tee -a /tmp/p0-foundation.log
          fi

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install -r requirements-ci.lock
            python -m pip install -e . --no-deps
            python -m pip check
          } 2>&1 | tee -a /tmp/p0-foundation.log

      - name: Focused P0 validation
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src tests scripts
            python -m harness.cli --help
            python -m harness.tui_conversation --help
            pytest -q \
              tests/test_p0_tui_config_oracle.py \
              tests/test_integration_tui.py \
              tests/test_tui_conversation_v2.py \
              tests/test_stage2_security.py \
              tests/test_integration_model_gateway.py \
              tests/test_integration_domains.py
          } 2>&1 | tee -a /tmp/p0-foundation.log

      - name: Full regression
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee -a /tmp/p0-foundation.log

      - name: Commit validated P0 foundation
        if: success()
        shell: bash
        run: |
          mkdir -p docs/tracks/integration-runtime
          {
            echo '# P0 Foundation Validation'
            echo
            echo '- Result: **PASS**'
            echo '- Runner: ubuntu-latest'
            echo '- Python: 3.11'
            echo '- Scope: TUI/TOML/domain unification and completion-oracle backend boundary'
            echo
            echo '## Verified gates'
            echo
            echo '- compileall'
            echo '- CLI help'
            echo '- conversational TUI help'
            echo '- focused P0/security/TUI/domain/model tests'
            echo '- full pytest regression'
          } > docs/tracks/integration-runtime/P0_FOUNDATION_VALIDATION.md
          rm -rf scripts/p0_patch_parts
          rm -f \
            scripts/.apply_p0_foundation_runtime.py \
            scripts/apply_boundary_deep_remediation.py \
            scripts/finalize_boundary_remediation.py \
            .github/workflows/boundary-deep-remediation.yml \
            .github/workflows/p0-foundation-remediation.yml \
            .github/workflows/p0-foundation-verify.yml \
            .github/workflows/p0-foundation-run.yml \
            docs/tracks/integration-runtime/.boundary-review-trigger \
            docs/tracks/integration-runtime/BOUNDARY_REMEDIATION_DIAGNOSTIC.md \
            docs/tracks/integration-runtime/P0_FOUNDATION_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify TUI config and oracle sandbox boundary'
          for attempt in 1 2 3 4; do
            git pull --rebase origin develop || exit 1
            if git push origin HEAD:develop; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Capture diagnostics
        if: failure()
        shell: bash
        run: |
          git diff --stat > /tmp/p0-foundation-diff-stat.txt || true
          git diff > /tmp/p0-foundation.patch || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-foundation-run-diagnostics
          path: |
            /tmp/p0-foundation.log
            /tmp/p0-foundation-diff-stat.txt
            /tmp/p0-foundation.patch
          if-no-files-found: ignore
