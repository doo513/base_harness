name: validate-base-harness

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile harness
        run: python3 -m compileall harness

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run strict validator
        run: python3 scripts/validate_harness.py --strict
