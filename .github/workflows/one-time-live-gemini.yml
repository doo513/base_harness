name: one-time-live-gemini

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-live-gemini.yml

permissions:
  contents: read
  statuses: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install harness
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Check secret
        id: secret
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Official Gemini OpenAI-compatible model lookup
        id: api
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/gemini-model-response.json -w '%{http_code}' \
            'https://generativelanguage.googleapis.com/v1beta/openai/models/gemini-3.6-flash' \
            -H "Authorization: Bearer $GEMINI_API_KEY")
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          test "$code" = '200'
      - name: Direct Gemini through Model Gateway
        id: direct
        if: steps.secret.outputs.present == 'true' && steps.api.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from harness.config import ModelConfig, SecretRef
          from harness.model_gateway import ModelGateway
          gateway = ModelGateway(
              models={"gemini": ModelConfig(
                  provider="openai-compatible",
                  model="gemini-3.6-flash",
                  endpoint="https://generativelanguage.googleapis.com/v1beta/openai/",
                  api_key=SecretRef.parse("env:GEMINI_API_KEY"),
                  timeout_seconds=120,
              )},
              default_model="gemini",
              max_attempts_per_model=1,
          )
          out = gateway.complete(system="Return only PONG.", user="Connectivity probe.")
          if out.strip() != "PONG":
              raise SystemExit("unexpected response")
          print("direct_model_gateway=PASS")
          PY
      - name: Full Harness Gemini probe
        id: harness
        if: steps.secret.outputs.present == 'true' && steps.direct.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          rm -rf /tmp/harness-live-workspace /tmp/harness-live-run
          mkdir -p /tmp/harness-live-workspace
          cat > /tmp/harness-live.toml <<'TOML'
          profile = "software"
          run_dir = "/tmp/harness-live-run"
          default_model = "gemini"

          [workspace]
          root = "/tmp/harness-live-workspace"

          [models.gemini]
          provider = "openai-compatible"
          model = "gemini-3.6-flash"
          endpoint = "https://generativelanguage.googleapis.com/v1beta/openai/"
          api_key = "env:GEMINI_API_KEY"
          timeout_seconds = 120

          [security]
          strict_layout = false
          strict_tool_isolation = false
          network_policy = "allow"
          require_sealed_oracle = false
          TOML

          python scripts/run_live_case.py \
            --config /tmp/harness-live.toml \
            --workspace /tmp/harness-live-workspace \
            --run-dir /tmp/harness-live-run \
            --profile software \
            --goal 'Create result.txt containing exactly HARNESS_GEMINI_OK followed by one newline. Use available tools and request completion only after the file satisfies the acceptance condition.' \
            --accept-command 'python -c "from pathlib import Path; assert Path(\"result.txt\").read_text(encoding=\"utf-8\") == \"HARNESS_GEMINI_OK\\n\""' \
            --max-steps 20 \
            --task-revision one-time-live-gemini-v2
          test "$(cat /tmp/harness-live-workspace/result.txt 2>/dev/null || true)" = 'HARNESS_GEMINI_OK'
      - name: Publish probe statuses
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_PRESENT: ${{ steps.secret.outputs.present }}
          API_OUTCOME: ${{ steps.api.outcome }}
          API_CODE: ${{ steps.api.outputs.http_code }}
          DIRECT_OUTCOME: ${{ steps.direct.outcome }}
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
        run: |
          post_status() {
            context="$1"; state="$2"; description="$3"
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
          }

          if [ "$SECRET_PRESENT" = 'true' ]; then
            post_status harness/gemini-secret success 'GEMINI_API_KEY secret is available to Actions'
          else
            post_status harness/gemini-secret error 'GEMINI_API_KEY secret is missing or empty'
          fi

          if [ "$API_OUTCOME" = 'success' ]; then
            post_status harness/gemini-api success 'Official Gemini model lookup HTTP 200'
          else
            post_status harness/gemini-api failure "Official Gemini model lookup HTTP ${API_CODE:-unknown}"
          fi

          if [ "$DIRECT_OUTCOME" = 'success' ]; then
            post_status harness/gemini-direct success 'Gemini API works through Model Gateway'
          else
            post_status harness/gemini-direct failure 'Gemini Model Gateway probe failed or was skipped'
          fi

          if [ "$HARNESS_OUTCOME" = 'success' ]; then
            post_status harness/gemini-live success 'Full Gemini Harness probe passed'
          else
            post_status harness/gemini-live failure 'Full Gemini Harness probe failed or was skipped'
          fi
