name: runtime-isolation-ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  verify-runtime-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CI dependencies
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Core freeze audit regression probe
        run: python scripts/core_freeze_audit_probe.py
      - name: Stage 02 backend-execution binding probe
        run: python scripts/stage2_tool_backend_binding_probe.py
      - name: Stage 02 live persistent-session namespace probe
        run: sudo -E "$(command -v python)" scripts/stage2_session_namespace_probe.py
      - name: Stage 04 semantic probe
        run: python scripts/stage4_semantic_probe.py
      - name: Stage 06 task-world progress probe
        run: python scripts/stage6_task_world_progress_probe.py
      - name: Stage 07 context probe
        run: python scripts/stage7_context_probe.py
      - name: Stage 08 retrieval probe
        run: python scripts/stage8_retrieval_probe.py
