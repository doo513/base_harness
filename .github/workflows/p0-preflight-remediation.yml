name: p0-preflight-remediation

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/p0-preflight-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-preflight-develop
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed preflight patch
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p0-preflight.log
          python scripts/apply_p0_preflight.py 2>&1 | tee -a /tmp/p0-preflight.log

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install -r requirements-ci.lock
            python -m pip install -e . --no-deps
            python -m pip check
          } 2>&1 | tee -a /tmp/p0-preflight.log

      - name: Focused preflight validation
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src tests scripts
            python -m harness.cli --help
            python -m harness.tui_conversation --help
            pytest -q \
              tests/test_p0_preflight.py \
              tests/test_p0_tui_config_oracle.py \
              tests/test_integration_tui.py \
              tests/test_tui_conversation_v2.py \
              tests/test_stage2_security.py \
              tests/test_integration_domains.py \
              tests/test_e2e_integration_runtime.py
          } 2>&1 | tee -a /tmp/p0-preflight.log

      - name: Full regression
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee -a /tmp/p0-preflight.log

      - name: Commit validated preflight layer
        if: success()
        shell: bash
        run: |
          mkdir -p docs/tracks/integration-runtime
          {
            echo '# P0 Preflight Validation'
            echo
            echo '- Result: **PASS**'
            echo '- Runner: ubuntu-latest'
            echo '- Python: 3.11'
            echo '- Scope: TaskAnalyzer, CapabilityResolver, EnvironmentPreflight, ReadinessGate'
            echo
            echo '## Gates'
            echo
            echo '- compileall'
            echo '- CLI and TUI help'
            echo '- focused P0, security, domain and E2E tests'
            echo '- full pytest regression'
          } > docs/tracks/integration-runtime/P0_PREFLIGHT_VALIDATION.md
          rm -f \
            scripts/apply_p0_preflight.py \
            .github/workflows/p0-preflight-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add task capability and environment preflight'
          for attempt in 1 2 3 4; do
            git pull --rebase origin develop || exit 1
            if git push origin HEAD:develop; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Capture diagnostics
        if: failure()
        shell: bash
        run: |
          git diff --stat > /tmp/p0-preflight-diff-stat.txt || true
          git diff > /tmp/p0-preflight.patch || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-preflight-diagnostics
          path: |
            /tmp/p0-preflight.log
            /tmp/p0-preflight-diff-stat.txt
            /tmp/p0-preflight.patch
          if-no-files-found: ignore
