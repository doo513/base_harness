name: p0-runtime-tui-oracle-remediation
# bundle-revision: 3

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/p0-runtime-tui-oracle-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-runtime-tui-oracle-develop
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore reviewed patch bundle
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cat scripts/p0_runtime_bundle/part*.b64 > /tmp/base_harness_p0_bundle.b64
            base64 --decode /tmp/base_harness_p0_bundle.b64 > /tmp/base_harness_p0_bundle.zip
            expected='71081320b03990546e06aba23afc813f396c32b71f972d49c78e4aa2b34dfe23'
            actual="$(sha256sum /tmp/base_harness_p0_bundle.zip | awk '{print $1}')"
            test "$actual" = "$expected"
            rm -rf /tmp/base_harness_p0_bundle
            mkdir -p /tmp/base_harness_p0_bundle
            unzip -q /tmp/base_harness_p0_bundle.zip -d /tmp/base_harness_p0_bundle
            python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/base_harness_p0_bundle/base_harness_p0_bundle/apply.py')
          text = path.read_text(encoding='utf-8')
          old = "if 'if self.strict_layout is not None:' not in text:"
          new = "if 'if self.strict_layout is not None:' not in text and 'for value, positive, negative in (' not in text:"
          if old not in text:
              raise SystemExit('compatibility anchor was not found in reviewed applicator')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY
          } 2>&1 | tee /tmp/p0-runtime.log

      - name: Apply reviewed P0 patch
        id: apply
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python /tmp/base_harness_p0_bundle/base_harness_p0_bundle/apply.py . --no-test 2>&1 | tee -a /tmp/p0-runtime.log

      - name: Install locked CI dependencies
        id: install
        if: steps.restore.outcome == 'success' && steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install -r requirements-ci.lock
            python -m pip install -e . --no-deps
            python -m pip check
          } 2>&1 | tee -a /tmp/p0-runtime.log

      - name: Focused P0 validation
        id: focused
        if: steps.restore.outcome == 'success' && steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src tests scripts
            python -m harness.cli --help
            python -m harness.tui_conversation --help
            pytest -q \
              tests/test_p0_runtime_settings.py \
              tests/test_integration_tui.py \
              tests/test_tui_conversation_v2.py \
              tests/test_stage2_security.py
          } 2>&1 | tee -a /tmp/p0-runtime.log

      - name: Full regression
        id: full
        if: steps.restore.outcome == 'success' && steps.apply.outcome == 'success' && steps.install.outcome == 'success' && steps.focused.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee -a /tmp/p0-runtime.log

      - name: Persist failed-stage diagnostics
        if: steps.restore.outcome != 'success' || steps.apply.outcome != 'success' || steps.install.outcome != 'success' || steps.focused.outcome != 'success' || steps.full.outcome != 'success'
        shell: bash
        run: |
          restore='${{ steps.restore.outcome }}'
          apply='${{ steps.apply.outcome }}'
          install='${{ steps.install.outcome }}'
          focused='${{ steps.focused.outcome }}'
          full='${{ steps.full.outcome }}'
          git diff --stat > /tmp/p0-runtime-diff-stat.txt || true
          git reset --hard HEAD
          mkdir -p docs/tracks/integration-runtime
          {
            echo '# P0 Runtime/TUI/Oracle Remediation Diagnostic'
            echo
            echo "- restore: $restore"
            echo "- apply: $apply"
            echo "- install: $install"
            echo "- focused: $focused"
            echo "- full: $full"
            echo
            echo '## Proposed diff stat before reset'
            echo '```text'
            cat /tmp/p0-runtime-diff-stat.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Last log'
            echo '```text'
            tail -n 320 /tmp/p0-runtime.log 2>/dev/null || true
            echo '```'
          } > docs/tracks/integration-runtime/P0_RUNTIME_TUI_ORACLE_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracks/integration-runtime/P0_RUNTIME_TUI_ORACLE_DIAGNOSTIC.md
          git commit -m 'ci: record P0 runtime remediation diagnostic [skip ci]' || true
          git pull --rebase origin develop
          git push origin HEAD:develop
          exit 1

      - name: Commit validated P0 runtime changes
        if: steps.restore.outcome == 'success' && steps.apply.outcome == 'success' && steps.install.outcome == 'success' && steps.focused.outcome == 'success' && steps.full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/p0_runtime_bundle
          rm -f .github/workflows/p0-runtime-tui-oracle-remediation.yml
          rm -f docs/tracks/integration-runtime/P0_RUNTIME_TUI_ORACLE_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: unify TUI settings and sandboxed completion'
          for attempt in 1 2 3 4; do
            git pull --rebase origin develop
            if git push origin HEAD:develop; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
