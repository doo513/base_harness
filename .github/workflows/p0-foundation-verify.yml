name: p0-foundation-verify

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/p0-foundation-verify.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-foundation-develop
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply P0 patch only when not already present
        id: apply
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p0-verify.log
          if [ ! -f src/harness/tui_config.py ]; then
            test -d scripts/p0_patch_parts
            cat scripts/p0_patch_parts/part_*.pyfrag > /tmp/apply_p0_foundation.py
            python /tmp/apply_p0_foundation.py 2>&1 | tee -a /tmp/p0-verify.log
          else
            echo 'P0 source already present; validating committed implementation.' | tee -a /tmp/p0-verify.log
          fi

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install -r requirements-ci.lock
            python -m pip install -e . --no-deps
            python -m pip check
          } 2>&1 | tee -a /tmp/p0-verify.log

      - name: Focused validation
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src tests scripts
            python -m harness.cli --help
            python -m harness.tui_conversation --help
            pytest -q \
              tests/test_p0_tui_config_oracle.py \
              tests/test_integration_tui.py \
              tests/test_tui_conversation_v2.py \
              tests/test_stage2_security.py \
              tests/test_integration_model_gateway.py \
              tests/test_integration_domains.py
          } 2>&1 | tee -a /tmp/p0-verify.log

      - name: Full regression
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee -a /tmp/p0-verify.log

      - name: Persist validated result
        if: success()
        shell: bash
        run: |
          mkdir -p docs/tracks/integration-runtime
          {
            echo '# P0 Foundation Validation'
            echo
            echo '- Result: **PASS**'
            echo '- Runner: ubuntu-latest'
            echo '- Python: 3.11'
            echo '- Scope: TUI/TOML/domain unification and completion-oracle backend boundary'
            echo
            echo '## Verified gates'
            echo
            echo '- compileall'
            echo '- CLI help'
            echo '- conversational TUI help'
            echo '- focused P0/security/TUI/domain/model tests'
            echo '- full pytest regression'
          } > docs/tracks/integration-runtime/P0_FOUNDATION_VALIDATION.md
          rm -rf scripts/p0_patch_parts
          rm -f \
            .github/workflows/p0-foundation-remediation.yml \
            .github/workflows/p0-foundation-verify.yml \
            docs/tracks/integration-runtime/P0_FOUNDATION_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: validate P0 TUI config and oracle boundary'
          for attempt in 1 2 3 4; do
            git pull --rebase origin develop || exit 1
            if git push origin HEAD:develop; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Capture diagnostics
        if: failure()
        shell: bash
        run: |
          git diff --stat > /tmp/p0-verify-diff-stat.txt || true
          git diff > /tmp/p0-verify-diff.patch || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-foundation-verify-diagnostics
          path: |
            /tmp/p0-verify.log
            /tmp/p0-verify-diff-stat.txt
            /tmp/p0-verify-diff.patch
          if-no-files-found: ignore
