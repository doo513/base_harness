name: one-time-local-qwen-ab

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  OLLAMA_API_KEY: ollama
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  local-qwen-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/local-qwen25-coder15b-ab
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install harness dependencies
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip install -e . --no-deps
          python -m pip check
          python -m py_compile scripts/run_local_qwen_ab_fast.py
      - name: Install and start Ollama locally
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull local coding model
        run: ollama pull qwen2.5-coder:0.5b-instruct
      - name: Probe local model
        run: |
          python - <<'PY'
          import json, urllib.request
          r=urllib.request.Request('http://127.0.0.1:11434/v1/chat/completions',data=json.dumps({'model':'qwen2.5-coder:0.5b-instruct','messages':[{'role':'user','content':'Return exactly LOCAL_MODEL_OK'}],'stream':False,'temperature':0,'max_tokens':24}).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer ollama'},method='POST')
          with urllib.request.urlopen(r,timeout=120) as x: p=json.loads(x.read().decode())
          c=p['choices'][0]['message']['content']; print('probe=',repr(c)); assert 'LOCAL_MODEL_OK' in c
          PY
      - name: Run Direct vs Harness comparison
        id: experiment
        continue-on-error: true
        run: python scripts/run_local_qwen_ab_fast.py
      - name: Show local model tail
        if: always()
        run: tail -n 60 /tmp/ollama.log || true
