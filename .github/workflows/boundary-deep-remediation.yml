name: boundary-deep-remediation

on:
  push:
    branches:
      - develop
    paths:
      - scripts/apply_boundary_deep_remediation.py
      - .github/workflows/boundary-deep-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boundary-deep-remediation-develop
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply evidence-based boundary remediation
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_boundary_deep_remediation.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _stderr_loop(self) -> None:\\n        process = self.process\\n        if process is None or process.stderr is None:\\n            return\\n        for line in process.stderr:\\n            self._stderr_tail.append(line.rstrip()[:2000])\\n\\n    def stderr_tail(self) -> tuple[str, ...]:\\n'''
          new = '''    def _stderr_loop(self) -> None:\\n        process = self.process\\n        if process is None or process.stderr is None:\\n            return\\n        while True:\\n            chunk = process.stderr.read(4096)\\n            if not chunk:\\n                break\\n            lines = chunk.splitlines() or [chunk]\\n            for line in lines:\\n                if line:\\n                    self._stderr_tail.append(line[:2000])\\n\\n    def stderr_tail(self) -> tuple[str, ...]:\\n'''
          if old not in text:
              raise SystemExit('expected MCP stderr applicator fragment not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY

          python scripts/apply_boundary_deep_remediation.py 2>&1 | tee /tmp/boundary-step.log

          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected fragment not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          # A malformed Actor decision is now a protocol error by design, not an
          # internal implementation bug.
          replace(
              'tests/test_hardening.py',
              'assert any(f["kind"] == "implementation_error" for f in state.failures)',
              'assert any(f["kind"] == "model_protocol_error" for f in state.failures)',
          )

          # RunLaunchSpec must carry the task overlay explicitly so resume can
          # reconstruct the exact completion contract before config-hash check.
          replace(
              'src/harness/tui.py',
              '    model_revision: str | None = None\n    execution_backend: str | None = None\n',
              '    model_revision: str | None = None\n    artifact_target: str | None = None\n    execution_backend: str | None = None\n',
          )
          replace(
              'src/harness/tui.py',
              '        if self.model_revision:\n            argv += ["--model-revision", self.model_revision]\n        if self.sealed_oracle_root:\n',
              '        if self.model_revision:\n            argv += ["--model-revision", self.model_revision]\n        if self.artifact_target:\n            argv += ["--artifact-target", self.artifact_target]\n        if self.sealed_oracle_root:\n',
          )

          replace(
              'src/harness/tui_conversation.py',
              '        "task_revision": spec.task_revision,\n        "execution_backend": spec.execution_backend,\n',
              '        "task_revision": spec.task_revision,\n        "artifact_target": spec.artifact_target,\n        "execution_backend": spec.execution_backend,\n',
          )

          marker = '''def _resume_backend_from_manifest(config: dict[str, Any]) -> str | None:\n'''
          helper = '''def _artifact_target_from_manifest(config: dict[str, Any], hint: dict[str, Any]) -> str | None:\n    hinted = hint.get("artifact_target")\n    if isinstance(hinted, str) and hinted.strip():\n        return hinted.strip()\n\n    goal = config.get("goal") if isinstance(config.get("goal"), dict) else {}\n    pinned = goal.get("pinned_constraints") if isinstance(goal.get("pinned_constraints"), list) else []\n    prefix = "final artifact path is "\n    for item in pinned:\n        if isinstance(item, str) and item.startswith(prefix) and item[len(prefix):].strip():\n            return item[len(prefix):].strip()\n\n    acceptance = goal.get("acceptance") if isinstance(goal.get("acceptance"), list) else []\n    prefix = "produce requested evidence-backed artifact: "\n    for item in acceptance:\n        if isinstance(item, str) and item.startswith(prefix) and item[len(prefix):].strip():\n            return item[len(prefix):].strip()\n    return None\n\n\ndef _sealed_oracle_root_from_manifest(config: dict[str, Any]) -> str | None:\n    oracle = config.get("oracle") if isinstance(config.get("oracle"), dict) else {}\n    if not bool(oracle.get("sealed")):\n        return None\n    backend = oracle.get("backend") if isinstance(oracle.get("backend"), dict) else {}\n    backend_config = backend.get("config") if isinstance(backend.get("config"), dict) else {}\n    paths = backend_config.get("read_only_paths")\n    if not isinstance(paths, list) or len(paths) != 1:\n        return None\n    value = paths[0]\n    if isinstance(value, dict) and isinstance(value.get("path"), str):\n        return value["path"]\n    if isinstance(value, str):\n        return value\n    return None\n\n\n'''
          replace('src/harness/tui_conversation.py', marker, helper + marker)

          old = '''    goal_desc = config.get("goal") if isinstance(config.get("goal"), dict) else {}\n    acceptance = goal_desc.get("acceptance") if isinstance(goal_desc.get("acceptance"), list) else []\n    hint = _session_hint(run_dir)\n\n    hinted_config = hint.get("config") if isinstance(hint.get("config"), str) else None\n    if hinted_config and Path(hinted_config).expanduser().exists():\n        config_path = hinted_config\n    else:\n        config_path = state.config if Path(state.config).expanduser().exists() else None\n\n    backend = hint.get("execution_backend") if isinstance(hint.get("execution_backend"), str) else None\n'''
          new = '''    goal_desc = config.get("goal") if isinstance(config.get("goal"), dict) else {}\n    hint = _session_hint(run_dir)\n    artifact_target = _artifact_target_from_manifest(config, hint)\n\n    # Never let presentation-only hint data choose a config file: loading a\n    # different config can instantiate model/MCP/plugin providers before the\n    # runtime reaches its manifest config-hash check. The currently selected\n    # operator config may propose the resume environment; the manifest remains\n    # the authority and will reject any semantic mismatch.\n    config_path = state.config if Path(state.config).expanduser().exists() else None\n\n    budget_desc = config.get("budget") if isinstance(config.get("budget"), dict) else {}\n    max_steps = budget_desc.get("hard_max_steps", 30)\n    if not isinstance(max_steps, int) or isinstance(max_steps, bool) or max_steps <= 0:\n        return None\n\n    oracle_desc = config.get("oracle") if isinstance(config.get("oracle"), dict) else {}\n    command_count = oracle_desc.get("command_count", 0)\n    if not isinstance(command_count, int) or isinstance(command_count, bool) or command_count < 0:\n        return None\n    acceptance_commands: tuple[str, ...] = ()\n    if profile in {"software", "hackathon"} and artifact_target is None and command_count:\n        hinted_commands = hint.get("acceptance_commands")\n        if (\n            not isinstance(hinted_commands, list)\n            or len(hinted_commands) != command_count\n            or any(not isinstance(item, str) or not item for item in hinted_commands)\n        ):\n            return None\n        acceptance_commands = tuple(hinted_commands)\n\n    task_revision = manifest.get("task_revision")\n    if task_revision == "UNSPECIFIED":\n        task_revision = None\n    elif not isinstance(task_revision, str):\n        return None\n\n    backend = hint.get("execution_backend") if isinstance(hint.get("execution_backend"), str) else None\n'''
          replace('src/harness/tui_conversation.py', old, new)

          old = '''        acceptance_commands=tuple(str(item) for item in acceptance if isinstance(item, str)),\n        task_revision=(hint.get("task_revision") if isinstance(hint.get("task_revision"), str) else None),\n        execution_backend=backend,\n'''
          new = '''        acceptance_commands=acceptance_commands,\n        max_steps=max_steps,\n        task_revision=task_revision,\n        artifact_target=artifact_target,\n        execution_backend=backend,\n'''
          replace('src/harness/tui_conversation.py', old, new)

          old = '''        require_sealed_oracle=optional_bool("require_sealed_oracle"),\n        sealed_oracle_root=(hint.get("sealed_oracle_root") if isinstance(hint.get("sealed_oracle_root"), str) else None),\n        require_oracle_isolation=(hint.get("require_oracle_isolation") if isinstance(hint.get("require_oracle_isolation"), bool) else None),\n'''
          new = '''        require_sealed_oracle=optional_bool("require_sealed_oracle"),\n        sealed_oracle_root=_sealed_oracle_root_from_manifest(config),\n        require_oracle_isolation=(\n            bool(oracle_desc.get("require_filesystem_isolation"))\n            if "require_filesystem_isolation" in oracle_desc\n            else None\n        ),\n'''
          replace('src/harness/tui_conversation.py', old, new)

          replace(
              'src/harness/tui_conversation.py',
              '        acceptance_commands=tuple(acceptance),\n        max_steps=30,\n        resume=False,\n',
              '        acceptance_commands=tuple(acceptance),\n        max_steps=30,\n        artifact_target=artifact_target,\n        resume=False,\n',
          )

          # The artifact target is now explicit in argv; retain the environment
          # bridge only for backward compatibility with older launcher paths.

          tests = Path('tests/test_tui_conversation_v2.py')
          text = tests.read_text(encoding='utf-8')
          if 'test_tui_v2_resume_spec_reconstructs_artifact_overlay_and_budget' not in text:
              text += '''\n\ndef test_tui_v2_resume_spec_reconstructs_artifact_overlay_and_budget(tmp_path):\n    workspace = tmp_path / "artifact-workspace"\n    workspace.mkdir()\n    run_dir = tmp_path / "artifact-run"\n    run_dir.mkdir()\n    RunManifestStore(run_dir / "run_manifest.json").create({\n        "run_id": "artifact-run",\n        "harness_version": __version__,\n        "task_revision": "task-r1",\n        "model_revision": "model-r1",\n        "config": {\n            "workspace": str(workspace),\n            "profile": {\n                "name": "software",\n                "class": "harness.task_contracts.EvidenceArtifactTaskProfile",\n            },\n            "goal": {\n                "acceptance": ["produce requested evidence-backed artifact: DEEP_REPORT.md"],\n                "pinned_constraints": ["final artifact path is DEEP_REPORT.md"],\n            },\n            "security": {\n                "strict_layout": False,\n                "strict_tool_isolation": False,\n                "network_policy": "allow",\n                "require_sealed_oracle": False,\n            },\n            "budget": {"hard_max_steps": 17},\n            "oracle": {\n                "sealed": False,\n                "require_filesystem_isolation": False,\n            },\n            "tools": [],\n        },\n    })\n    state = AppState(workspace=str(tmp_path), config=str(tmp_path / "missing.toml"), mode="software")\n    spec = _session_resume_spec(state, run_dir)\n    assert spec is not None\n    assert spec.artifact_target == "DEEP_REPORT.md"\n    assert spec.max_steps == 17\n    assert spec.task_revision == "task-r1"\n    command = spec.command(python_executable="python-test")\n    assert command[command.index("--artifact-target") + 1] == "DEEP_REPORT.md"\n\n\ndef test_tui_v2_resume_does_not_treat_goal_acceptance_as_shell_command(tmp_path):\n    workspace = tmp_path / "command-workspace"\n    workspace.mkdir()\n    run_dir = tmp_path / "command-run"\n    run_dir.mkdir()\n    RunManifestStore(run_dir / "run_manifest.json").create({\n        "run_id": "command-run",\n        "harness_version": __version__,\n        "task_revision": "UNSPECIFIED",\n        "model_revision": "model-r1",\n        "config": {\n            "workspace": str(workspace),\n            "profile": {"name": "software"},\n            "goal": {"acceptance": ["all required behavior is verified"], "pinned_constraints": []},\n            "security": {\n                "strict_layout": False,\n                "strict_tool_isolation": False,\n                "network_policy": "allow",\n                "require_sealed_oracle": False,\n            },\n            "budget": {"hard_max_steps": 30},\n            "oracle": {"sealed": False, "command_count": 1, "require_filesystem_isolation": False},\n            "tools": [],\n        },\n    })\n    (run_dir / "tui_session.json").write_text(\n        json.dumps({\n            "schema_version": 1,\n            "authority": "presentation_hint_only",\n            "config": str(tmp_path / "untrusted.toml"),\n            "acceptance_commands": ["python -m pytest -q"],\n        }),\n        encoding="utf-8",\n    )\n    state = AppState(workspace=str(tmp_path), config=str(tmp_path / "missing.toml"), mode="software")\n    spec = _session_resume_spec(state, run_dir)\n    assert spec is not None\n    assert spec.config is None\n    assert spec.acceptance_commands == ("python -m pytest -q",)\n    assert "all required behavior is verified" not in spec.acceptance_commands\n'''
              tests.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Install locked CI dependencies
        id: install
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install -r requirements-ci.lock
            python -m pip install -e . --no-deps
            python -m pip check
          } 2>&1 | tee /tmp/boundary-step.log

      - name: Focused boundary validation
        id: focused
        if: steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src tests scripts
            pytest -q tests/test_hardening.py tests/test_integration_tui.py tests/test_tui_conversation_v2.py tests/test_task_intake_artifact_contract.py tests/test_integration_model_gateway.py tests/test_integration_mcp_plugin.py tests/test_boundary_remediation.py tests/test_windows_portable_contract.py
          } 2>&1 | tee /tmp/boundary-step.log

      - name: Full regression
        id: full
        if: steps.apply.outcome == 'success' && steps.install.outcome == 'success' && steps.focused.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/boundary-step.log

      - name: Persist failed-stage diagnostics
        if: steps.apply.outcome != 'success' || steps.install.outcome != 'success' || steps.focused.outcome != 'success' || steps.full.outcome != 'success'
        shell: bash
        run: |
          apply='${{ steps.apply.outcome }}'
          install='${{ steps.install.outcome }}'
          focused='${{ steps.focused.outcome }}'
          full='${{ steps.full.outcome }}'
          cp /tmp/boundary-step.log /tmp/last.log 2>/dev/null || true
          git diff --stat > /tmp/diff-stat.log || true
          git reset --hard HEAD
          mkdir -p docs/tracks/integration-runtime
          {
            echo '# Boundary Remediation Diagnostic'
            echo
            echo "- apply: $apply"
            echo "- install: $install"
            echo "- focused: $focused"
            echo "- full: $full"
            echo
            echo '## Proposed diff stat before reset'
            echo '```text'
            cat /tmp/diff-stat.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Last failing step log'
            echo '```text'
            tail -n 260 /tmp/last.log 2>/dev/null || true
            echo '```'
          } > docs/tracks/integration-runtime/BOUNDARY_REMEDIATION_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracks/integration-runtime/BOUNDARY_REMEDIATION_DIAGNOSTIC.md
          git commit -m 'ci: record boundary remediation diagnostic [skip ci]' || true
          for attempt in 1 2 3 4; do
            git pull --rebase origin develop || exit 1
            if git push origin HEAD:develop; then exit 1; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Commit validated remediation and remove one-shot applicator
        if: steps.apply.outcome == 'success' && steps.install.outcome == 'success' && steps.focused.outcome == 'success' && steps.full.outcome == 'success'
        shell: bash
        run: |
          rm -f scripts/apply_boundary_deep_remediation.py .github/workflows/boundary-deep-remediation.yml docs/tracks/integration-runtime/.boundary-review-trigger docs/tracks/integration-runtime/BOUNDARY_REMEDIATION_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden runtime boundaries from deep review'
          for attempt in 1 2 3 4; do
            git pull --rebase origin develop || exit 1
            if git push origin HEAD:develop; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
