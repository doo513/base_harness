name: research-ci

on:
  push:
    branches:
      - research/verified-state-stage03

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CI dependencies
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Full pytest regression
        run: pytest -q
      - name: Stage 03 resume probe
        run: python scripts/stage3_resume_probe.py
      - name: Stage 04 semantic probe
        run: python scripts/stage4_semantic_probe.py
      - name: Stage 05 recovery probe
        run: python scripts/stage5_recovery_probe.py
      - name: Stage 05 adversarial recovery probe
        run: python scripts/stage5_recovery_adversarial_probe.py
      - name: Stage 05 terminal recovery probe
        run: python scripts/stage5_terminal_probe.py
      - name: Stage 05 crash-window recovery probe
        run: python scripts/stage5_crash_window_probe.py
      - name: Stage 05 strategy generation probe
        run: python scripts/stage5_strategy_generation_probe.py
      - name: Stage 06 progress probe
        run: python scripts/stage6_progress_probe.py
      - name: Stage 06 adversarial progress probe
        run: python scripts/stage6_progress_adversarial_probe.py
      - name: Stage 06 progress resume probe
        run: python scripts/stage6_progress_resume_probe.py
      - name: Stage 06 progress boundary probe
        run: python scripts/stage6_progress_boundary_probe.py
      - name: Stage 06 progress strategy probe
        run: python scripts/stage6_progress_strategy_probe.py
      - name: Stage 07 context projection probe
        run: python scripts/stage7_context_probe.py
      - name: Stage 07 adversarial context probe
        run: python scripts/stage7_context_adversarial_probe.py
      - name: Stage 07 context resume probe
        run: python scripts/stage7_context_resume_probe.py
      - name: Stage 07 compatibility projection probe
        run: python scripts/stage7_context_compat_probe.py
      - name: Stage 07 trusted-context growth probe
        run: python scripts/stage7_trusted_context_probe.py
      - name: Stage 07 trusted-context cost probe
        run: python scripts/stage7_trusted_context_cost_probe.py
      - name: Stage 08 single-buffer artifact integrity probe
        run: python scripts/stage8_artifact_integrity_probe.py
      - name: Verified-read cost probe
        run: python scripts/remediation_artifact_cost_probe.py
      - name: Stage 02 nested read-only submount probe
        run: python scripts/stage2_nested_submount_probe.py
      - name: Stage 02 mount-topology cost probe
        run: python scripts/remediation_mount_topology_cost_probe.py
      - name: Stage 02 backend-execution binding probe
        run: python scripts/stage2_tool_backend_binding_probe.py
      - name: Stage 02 backend-binding cost probe
        run: python scripts/remediation_tool_binding_cost_probe.py
