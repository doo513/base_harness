name: research-ci

on:
  push:
    branches:
      - research/verified-state-stage03

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Full pytest regression
        run: pytest -q
      - name: Stage 03 resume probe
        run: python scripts/stage3_resume_probe.py
      - name: Stage 04 semantic probe
        run: python scripts/stage4_semantic_probe.py
      - name: Stage 05 recovery probe
        run: python scripts/stage5_recovery_probe.py
      - name: Stage 05 adversarial recovery probe
        run: python scripts/stage5_recovery_adversarial_probe.py
      - name: Stage 05 terminal recovery probe
        run: python scripts/stage5_terminal_probe.py
