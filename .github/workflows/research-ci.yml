name: core-regression-ci

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - docs/tracks/integration-runtime/CI_STATUS.md
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked CI dependencies
        id: install
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Full validation ledger
        id: ledger
        if: always()
        shell: bash
        run: |
          failures=0
          : > ci-gates.txt
          run_gate() {
            label="$1"
            shift
            printf '%-48s ' "$label" | tee -a ci-gates.txt
            if "$@"; then
              echo PASS | tee -a ci-gates.txt
            else
              echo FAIL | tee -a ci-gates.txt
              failures=1
            fi
          }

          run_gate compile python -m compileall -q src tests scripts
          run_gate cli-module python -m harness.cli --help
          run_gate tui-module python -m harness.tui --help
          run_gate cli-console verified-harness --help
          run_gate tui-console verified-harness-tui --help
          run_gate full-pytest bash -c 'pytest -q > full-pytest.log 2>&1; code=$?; if [ "$code" -ne 0 ]; then tail -n 200 full-pytest.log; fi; exit "$code"'
          run_gate core-freeze-audit python scripts/core_freeze_audit_probe.py
          run_gate stage03-resume python scripts/stage3_resume_probe.py
          run_gate stage04-semantic python scripts/stage4_semantic_probe.py
          run_gate stage04-realworld python scripts/stage4_realworld_semantic_benchmark.py
          run_gate stage05-recovery python scripts/stage5_recovery_probe.py
          run_gate stage05-adversarial python scripts/stage5_recovery_adversarial_probe.py
          run_gate stage05-terminal python scripts/stage5_terminal_probe.py
          run_gate stage05-crash-window python scripts/stage5_crash_window_probe.py
          run_gate stage05-strategy python scripts/stage5_strategy_generation_probe.py
          run_gate stage05-effectiveness python scripts/stage5_recovery_effectiveness_benchmark.py
          run_gate stage06-progress python scripts/stage6_progress_probe.py
          run_gate stage06-adversarial python scripts/stage6_progress_adversarial_probe.py
          run_gate stage06-resume python scripts/stage6_progress_resume_probe.py
          run_gate stage06-boundary python scripts/stage6_progress_boundary_probe.py
          run_gate stage06-strategy python scripts/stage6_progress_strategy_probe.py
          run_gate stage06-task-world python scripts/stage6_task_world_progress_probe.py
          run_gate stage07-context python scripts/stage7_context_probe.py
          run_gate stage07-adversarial python scripts/stage7_context_adversarial_probe.py
          run_gate stage07-resume python scripts/stage7_context_resume_probe.py
          run_gate stage07-compat python scripts/stage7_context_compat_probe.py
          run_gate stage07-trusted-context python scripts/stage7_trusted_context_probe.py
          run_gate stage07-context-cost python scripts/stage7_trusted_context_cost_probe.py
          run_gate stage07-goal-bounds python scripts/stage7_goal_contract_bounds_probe.py
          run_gate stage08-retrieval python scripts/stage8_retrieval_probe.py
          run_gate stage08-adversarial python scripts/stage8_retrieval_adversarial_probe.py
          run_gate stage08-resume python scripts/stage8_retrieval_resume_probe.py
          run_gate stage08-cost python scripts/stage8_retrieval_cost_probe.py
          run_gate stage08-artifact-integrity python scripts/stage8_artifact_integrity_probe.py
          run_gate verified-read-cost python scripts/remediation_artifact_cost_probe.py
          run_gate stage02-nested-submount python scripts/stage2_nested_submount_probe.py
          run_gate stage02-mount-cost python scripts/remediation_mount_topology_cost_probe.py
          run_gate stage02-backend-binding python scripts/stage2_tool_backend_binding_probe.py
          run_gate stage02-binding-cost python scripts/remediation_tool_binding_cost_probe.py

          exit "$failures"

      - name: Publish observable regression status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='one or more full-regression gates failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='all regression, probes, CLI and TUI gates passed'
          fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"harness/full-regression\",\"description\":\"$description\"}"

      - name: Persist regression evidence
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          result=FAIL
          if [ "$JOB_STATUS" = 'success' ]; then result=PASS; fi
          mkdir -p docs/tracks/integration-runtime
          {
            echo '# Integration Runtime CI Status'
            echo
            echo "- Source commit: $SOURCE_SHA"
            echo "- Branch: $SOURCE_BRANCH"
            echo "- Result: **$result**"
            echo '- Runner: ubuntu-latest'
            echo '- Python: 3.11'
            echo "- Install gate: $INSTALL_OUTCOME"
            echo
            echo '## Gate ledger'
            echo
            echo '```text'
            if [ -f ci-gates.txt ]; then cat ci-gates.txt; else echo 'validation ledger unavailable'; fi
            echo '```'
            if [ -f full-pytest.log ]; then
              echo
              echo '## Full pytest tail'
              echo
              echo '```text'
              tail -n 160 full-pytest.log
              echo '```'
            fi
          } > docs/tracks/integration-runtime/CI_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracks/integration-runtime/CI_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record integration runtime verification [skip ci]'
          git push

  remediate-boundaries:
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect one-shot remediation
        id: detect
        shell: bash
        run: |
          if [ -f scripts/apply_boundary_deep_remediation.py ] && [ -f scripts/finalize_boundary_remediation.py ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed boundary remediation
        id: apply
        if: steps.detect.outputs.active == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python scripts/apply_boundary_deep_remediation.py
            python scripts/finalize_boundary_remediation.py
          } 2>&1 | tee /tmp/boundary-remediation.log

      - name: Install locked CI dependencies
        id: remediation_install
        if: steps.detect.outputs.active == 'true' && steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install -r requirements-ci.lock
            python -m pip install -e . --no-deps
            python -m pip check
          } 2>&1 | tee -a /tmp/boundary-remediation.log

      - name: Focused boundary regression
        id: focused
        if: steps.detect.outputs.active == 'true' && steps.apply.outcome == 'success' && steps.remediation_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src tests scripts
            pytest -q \
              tests/test_hardening.py \
              tests/test_integration_tui.py \
              tests/test_tui_conversation_v2.py \
              tests/test_task_intake_artifact_contract.py \
              tests/test_integration_model_gateway.py \
              tests/test_integration_mcp_plugin.py \
              tests/test_boundary_remediation.py \
              tests/test_windows_portable_contract.py
          } 2>&1 | tee -a /tmp/boundary-remediation.log

      - name: Full regression on proposed source
        id: remediation_full
        if: steps.detect.outputs.active == 'true' && steps.apply.outcome == 'success' && steps.remediation_install.outcome == 'success' && steps.focused.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee -a /tmp/boundary-remediation.log

      - name: Persist remediation failure
        if: >-
          steps.detect.outputs.active == 'true' &&
          (steps.apply.outcome != 'success' ||
           steps.remediation_install.outcome != 'success' ||
           steps.focused.outcome != 'success' ||
           steps.remediation_full.outcome != 'success')
        shell: bash
        run: |
          git diff --stat > /tmp/boundary-diff-stat.txt || true
          git reset --hard HEAD
          mkdir -p docs/tracks/integration-runtime
          {
            echo '# Boundary Remediation Diagnostic'
            echo
            echo "- source: ${{ github.sha }}"
            echo "- apply: ${{ steps.apply.outcome }}"
            echo "- install: ${{ steps.remediation_install.outcome }}"
            echo "- focused: ${{ steps.focused.outcome }}"
            echo "- full: ${{ steps.remediation_full.outcome }}"
            echo
            echo '## Proposed diff stat before reset'
            echo '```text'
            cat /tmp/boundary-diff-stat.txt
            echo '```'
            echo
            echo '## Validation log'
            echo '```text'
            tail -n 320 /tmp/boundary-remediation.log 2>/dev/null || true
            echo '```'
          } > docs/tracks/integration-runtime/BOUNDARY_REMEDIATION_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracks/integration-runtime/BOUNDARY_REMEDIATION_DIAGNOSTIC.md
          git commit -m 'ci: record boundary remediation diagnostic [skip ci]' || true
          git pull --rebase origin develop
          git push origin HEAD:develop
          exit 1

      - name: Commit validated remediation
        if: >-
          steps.detect.outputs.active == 'true' &&
          steps.apply.outcome == 'success' &&
          steps.remediation_install.outcome == 'success' &&
          steps.focused.outcome == 'success' &&
          steps.remediation_full.outcome == 'success'
        shell: bash
        run: |
          rm -f \
            scripts/apply_boundary_deep_remediation.py \
            scripts/finalize_boundary_remediation.py \
            .github/workflows/boundary-deep-remediation.yml \
            docs/tracks/integration-runtime/.boundary-review-trigger \
            docs/tracks/integration-runtime/BOUNDARY_REMEDIATION_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden runtime boundaries from deep review'
          git pull --rebase origin develop
          git push origin HEAD:develop
