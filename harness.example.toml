profile = "software"
run_dir = "./run"
acceptance_commands = []
default_model = "primary"

[workspace]
root = "."
temp_dir = ".harness-tmp"
build_dir = "build"
cache_dir = ".cache/harness"

[security]
execution_backend = "local"
strict_layout = false
strict_tool_isolation = false
network_policy = "allow"
require_sealed_oracle = false
require_oracle_isolation = false

[memory]
enabled = false
root = "../.verified-state-harness-memory"
# project_id = "my-project"

[models.primary]
provider = "openai-compatible"
model = "example-model"
endpoint = "https://example.invalid/v1"
api_key = "env:MODEL_API_KEY"
timeout_seconds = 120

# Native local structured-output routes. Set default_model to one of these aliases
# instead of routing Ollama/LM Studio through generic openai-compatible mode.
[models.ollama]
provider = "ollama"
model = "gemma3:latest"
endpoint = "http://127.0.0.1:11434"
timeout_seconds = 120

[models.ollama.options]
temperature = 0
max_tokens = 1024
think = false
# Set this to the actual context configured in Ollama when known.
context_window = 8192
reserved_output_tokens = 1024
context_safety_margin_tokens = 256

[models.lmstudio]
provider = "lm-studio"
model = "local-model"
endpoint = "http://127.0.0.1:1234/v1"
timeout_seconds = 120

[models.lmstudio.options]
temperature = 0
max_tokens = 1024
context_window = 8192
reserved_output_tokens = 1024
context_safety_margin_tokens = 256

# Preferred OpenCode setup:
#   1. Install/authenticate OpenCode normally.
#   2. Start `verified-harness-tui`.
#   3. Run `/model opencode`.
# The Harness runs `opencode models opencode --verbose`, shows the catalog with
# explicitly-free models first, and creates/updates [models.opencode] below.
# The concrete model id, context metadata and explicit catalog cost metadata are
# pinned in harness.toml so an experiment can be repeated with the same route.
#
# Manual illustration only; replace the provider/model id with a currently
# available model from your own `opencode models opencode --verbose` output.
[models.opencode]
provider = "command"
model = "opencode/YOUR_MODEL_ID"
command = "python -m harness.opencode_adapter --model opencode/YOUR_MODEL_ID --agent harness-model"
timeout_seconds = 240

[models.opencode.options]
adapter = "opencode"
catalog_provider = "opencode"
catalog_model_id = "YOUR_MODEL_ID"
opencode_agent = "harness-model"
reserved_output_tokens = 2048
context_safety_margin_tokens = 2048
context_safety_margin_source = "opencode_adapter_overhead_guard"
# The selector fills context_window and adjusts reserves using the selected
# model's catalog limits. catalog_explicitly_free is written only when the
# catalog explicitly reports zero input and output cost.

# Unknown/custom providers can declare transport features explicitly without
# assigning a model intelligence tier. Supported override keys include:
# capability_structured_output, capability_native_tool_calling,
# capability_streaming, capability_vision, capability_reasoning.

[models.local]
provider = "command"
command = "local-agent --json"
timeout_seconds = 120

[[mcp]]
name = "repo"
transport = "stdio"
command = ["mcp-repo"]
enabled = false

[mcp.env]
TOKEN = "env:MCP_TOKEN"

[[plugins]]
name = "example"
module = "example_plugin"
enabled = false
