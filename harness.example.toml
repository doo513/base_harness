profile = "software"
run_dir = "./run"
acceptance_commands = []
default_model = "primary"

[workspace]
root = "."
temp_dir = ".harness-tmp"
build_dir = "build"
cache_dir = ".cache/harness"

[security]
execution_backend = "local"
strict_layout = false
strict_tool_isolation = false
network_policy = "allow"
require_sealed_oracle = false
require_oracle_isolation = false

[memory]
enabled = false
root = "../.verified-state-harness-memory"
# project_id = "my-project"

[models.primary]
provider = "openai-compatible"
model = "example-model"
endpoint = "https://example.invalid/v1"
api_key = "env:MODEL_API_KEY"
timeout_seconds = 120

# Native local structured-output routes. Set default_model to one of these aliases
# instead of routing Ollama/LM Studio through generic openai-compatible mode.
[models.ollama]
provider = "ollama"
model = "gemma3:latest"
endpoint = "http://127.0.0.1:11434"
timeout_seconds = 120

[models.ollama.options]
temperature = 0
max_tokens = 1024
think = false

[models.lmstudio]
provider = "lm-studio"
model = "local-model"
endpoint = "http://127.0.0.1:1234/v1"
timeout_seconds = 120

[models.lmstudio.options]
temperature = 0
max_tokens = 1024

[models.local]
provider = "command"
command = "local-agent --json"
timeout_seconds = 120

[[mcp]]
name = "repo"
transport = "stdio"
command = ["mcp-repo"]
enabled = false

[mcp.env]
TOKEN = "env:MCP_TOKEN"

[[plugins]]
name = "example"
module = "example_plugin"
enabled = false
