profile = "software"
run_dir = "./run"
acceptance_commands = []
default_model = "primary"

[workspace]
root = "."
temp_dir = ".harness-tmp"
build_dir = "build"
cache_dir = ".cache/harness"

[security]
execution_backend = "local"
strict_layout = false
strict_tool_isolation = false
network_policy = "allow"
require_sealed_oracle = false
require_oracle_isolation = false

[memory]
enabled = false
root = "../.verified-state-harness-memory"
# project_id = "my-project"

[models.primary]
provider = "openai-compatible"
model = "example-model"
endpoint = "https://example.invalid/v1"
api_key = "env:MODEL_API_KEY"
timeout_seconds = 120

# Native local structured-output routes. Set default_model to one of these aliases
# instead of routing Ollama/LM Studio through generic openai-compatible mode.
[models.ollama]
provider = "ollama"
model = "gemma3:latest"
endpoint = "http://127.0.0.1:11434"
timeout_seconds = 120

[models.ollama.options]
temperature = 0
max_tokens = 1024
think = false
# Set this to the actual context configured in Ollama when known.
context_window = 8192
reserved_output_tokens = 1024
context_safety_margin_tokens = 256

[models.lmstudio]
provider = "lm-studio"
model = "local-model"
endpoint = "http://127.0.0.1:1234/v1"
timeout_seconds = 120

[models.lmstudio.options]
temperature = 0
max_tokens = 1024
context_window = 8192
reserved_output_tokens = 1024
context_safety_margin_tokens = 256

# OpenCode is intentionally connected through the existing CommandProvider.
# The adapter runs `opencode run --format json` in a temporary workspace with
# OpenCode permissions denied, so OpenCode may only return a Harness decision;
# filesystem/shell/tool execution still belongs to base_harness.
# Replace the OpenCode model below with any provider/model already configured
# in your OpenCode installation.
[models.opencode]
provider = "command"
command = "python -m harness.opencode_adapter --model ollama/gemma3:latest --agent plan"
timeout_seconds = 240

[models.opencode.options]
adapter = "opencode"
# This is metadata for base_harness context budgeting. Match the underlying model.
context_window = 8192
reserved_output_tokens = 1024
context_safety_margin_tokens = 256

# Unknown/custom providers can declare transport features explicitly without
# assigning a model intelligence tier. Supported override keys include:
# capability_structured_output, capability_native_tool_calling,
# capability_streaming, capability_vision, capability_reasoning.

[models.local]
provider = "command"
command = "local-agent --json"
timeout_seconds = 120

[[mcp]]
name = "repo"
transport = "stdio"
command = ["mcp-repo"]
enabled = false

[mcp.env]
TOKEN = "env:MCP_TOKEN"

[[plugins]]
name = "example"
module = "example_plugin"
enabled = false
