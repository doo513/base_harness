[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-harness-verifier"
version = "2.0.0"
description = "Fail-closed Base Harness V2 verification sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness"]

[project.scripts]
base-harness-verifier = "harness.verified_sidecar:main"
